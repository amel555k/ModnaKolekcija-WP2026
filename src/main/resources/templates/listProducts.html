<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid;
            padding: 8px 12px;
        }

        th {
            text-align: left;
        }
    </style>
</head>
<body>
<nav>
    <a href="/products">Products</a>
    <a href="/brands">Brands</a>
</nav>

<h2>Products</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Description</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.description}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
