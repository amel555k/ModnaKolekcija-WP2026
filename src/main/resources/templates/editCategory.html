<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
    <style>
        label {
            display: block;
            margin-top: 10px;
        }

        input {
            display: block;
            padding: 6px;
            margin-top: 4px;
        }

        button {
            margin-top: 12px;
        }
    </style>
</head>
<body>
<nav>
    <a href="/products">Products</a>
    <a href="/brands">Brands</a>
    <a href="/categories">Categories</a>
</nav>

<h2>Edit Category</h2>

<form th:action="@{/categories/update/{id}(id=${category.id})}" method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" th:value="${category.name}" required>

    <label for="description">Description</label>
    <input type="text" id="description" name="description" th:value="${category.description}" required>

    <button type="submit">Update</button>
</form>
</body>
</html>
